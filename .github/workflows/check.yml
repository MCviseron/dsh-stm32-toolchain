name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Syntax
        run: |
          node --check lib/index.js
          node --check lib/bridge.mjs
          node --check lib/client.js
      - name: Tests
        shell: bash
        run: |
          set -o pipefail
          pnpm test 2>&1 | tee /tmp/tests.log || {
            echo "::error::$(grep -E '^(FAIL|not ok)|Error:|AssertionError' /tmp/tests.log | head -5 | tr '\n' ' ' | cut -c1-1500)"
            echo "::error::$(tail -20 /tmp/tests.log | tr '\n' ' ' | cut -c1-1500)"
            exit 1
          }
      - name: Package contents
        if: always()
        run: |
          pnpm pack --pack-destination /tmp >/dev/null
          tar -tzf /tmp/*.tgz | sort
