name: check

# The toolchain is Windows-first (UV4.exe, CubeMX, COM ports, D:\ drive layouts), so the
# suite is verified where it actually runs instead of on Linux where half of it is moot.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Syntax
        run: |
          node --check lib/index.js
          node --check lib/bridge.mjs
          node --check lib/client.js
      - name: Tests
        shell: bash
        env:
          DSH_STM32_CI: '1'
        run: |
          set -o pipefail
          pnpm test 2>&1 | tee "$RUNNER_TEMP/tests.log" || {
            echo "::error::$(grep -E '^(FAIL|not ok)|Error:|AssertionError' "$RUNNER_TEMP/tests.log" | head -5 | tr '\n' ' ' | cut -c1-1500)"
            echo "::error::$(tail -20 "$RUNNER_TEMP/tests.log" | tr '\n' ' ' | cut -c1-1500)"
            exit 1
          }
      - name: Package contents
        if: always()
        shell: bash
        run: |
          pnpm pack >/dev/null
          tar -tzf ./*.tgz | sort
          rm -f ./*.tgz
