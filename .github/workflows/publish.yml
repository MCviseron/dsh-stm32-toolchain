name: publish

# A tag is a release: push vX.Y.Z and the package goes to npm with provenance.
# Nothing else publishes - a plain push to main stays unpublished by design.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only pack and inspect, do not publish'
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write        # npm trusted publishing (OIDC), no long-lived token

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Node 24 ships npm >= 11.5, which is what trusted publishing requires.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # No explicit version: pnpm/action-setup reads packageManager from package.json
      # (specifying both is a hard error).
      - uses: pnpm/action-setup@v4

      - name: Tool versions
        run: |
          node --version
          npm --version
          pnpm --version

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Tests
        shell: bash
        env:
          DSH_STM32_CI: '1'
        run: |
          set -o pipefail
          pnpm test 2>&1 | tee "$RUNNER_TEMP/tests.log" || {
            echo "::error::$(grep -E '^(FAIL|not ok)|Error:|AssertionError' "$RUNNER_TEMP/tests.log" | head -5 | tr '\n' ' ' | cut -c1-1500)"
            echo "::error::$(tail -20 "$RUNNER_TEMP/tests.log" | tr '\n' ' ' | cut -c1-1500)"
            exit 1
          }

      - name: Tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VER=$(node -p "require('./package.json').version")
          echo "tag=$TAG package=$VER"
          if [ "$TAG" != "$VER" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json $VER"
            exit 1
          fi

      - name: Pack (what would ship)
        shell: bash
        run: |
          pnpm pack
          tar -tzf ./*.tgz | sort

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/') && (github.event_name != 'workflow_dispatch' || inputs.dry_run == false)
        shell: bash
        # No NODE_AUTH_TOKEN on purpose: an empty token breaks OIDC. The npm CLI uses
        # the GitHub OIDC token together with the trusted publisher configured on npmjs.com.
        run: |
          VER=$(node -p "require('./package.json').version")
          if npm view "dsh-stm32-toolchain@$VER" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
            echo "$VER is already on npm - nothing to publish (re-running a tag must not fail)."
            exit 0
          fi
          npm publish --access public --provenance --registry=https://registry.npmjs.org --json | tee "$RUNNER_TEMP/publish.json"
          echo "--- registry check ---"
          for i in 1 2 3 4 5 6 7 8; do
            SEEN=$(npm view "dsh-stm32-toolchain@$VER" version --registry=https://registry.npmjs.org 2>/dev/null || true)
            echo "attempt $i: $SEEN"
            if [ -n "$SEEN" ]; then exit 0; fi
            sleep 12
          done
          echo "::error::npm publish returned success but $VER never showed up in the registry"
          exit 1
