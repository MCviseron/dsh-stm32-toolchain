name: publish

# A tag is a release: push v0.2.2 and the package goes to npm with provenance.
# Nothing else publishes - a plain push to main stays unpublished by design.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only pack and inspect, do not publish'
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write        # npm trusted publishing (OIDC), no long-lived token

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node 24 ships npm >= 11.5, which is what trusted publishing requires.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # No explicit version: pnpm/action-setup reads packageManager from package.json
      # (specifying both is a hard error).
      - uses: pnpm/action-setup@v4

      - name: Tool versions
        run: |
          node --version
          npm --version
          pnpm --version

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Tests
        run: pnpm test

      - name: Tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VER=$(node -p "require('./package.json').version")
          echo "tag=$TAG package=$VER"
          if [ "$TAG" != "$VER" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json $VER"
            exit 1
          fi

      - name: Pack (what would ship)
        run: pnpm pack --pack-destination /tmp && tar -tzf /tmp/*.tgz | sort

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/') && (github.event_name != 'workflow_dispatch' || inputs.dry_run == false)
        # No NODE_AUTH_TOKEN on purpose: an empty token breaks OIDC. The npm CLI uses
        # the GitHub OIDC token together with the trusted publisher configured on npmjs.com.
        run: npm publish --access public --provenance --registry=https://registry.npmjs.org
